name: Package for Linux (Flatpak)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version string
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: FuseX-${{ inputs.version }}.flatpak
          manifest-path: .github/builds/linux/org.speccytools.FuseX.json
          cache-key: flatpak-builder-${{ github.sha }}
