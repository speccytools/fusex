name: Libspectrum for Windows
run-name: Build and test Libspectrum for Windows / ${{ github.actor }} /

on:
  workflow_call:
    inputs:
      key:
        type: string
        required: true
      fuse_ref:
        type: string
        default: ""
      use_zlib:
        type: boolean
        default: true
      use_bzip2:
        type: boolean
        default: true
      use_libgcrypt:
        type: boolean
        default: true

jobs:
  build:
    name: Build & Test (MSYS2 MINGW32)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    env:
      LIBSPECTRUM_DIR: 3rdparty/libspectrum
      CPPFLAGS: -I/usr/local/i686-w64-mingw32/include
      LDFLAGS: -L/usr/local/i686-w64-mingw32/lib

    steps:
      # Use the workflow revision's packaging helpers, not the selected library ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.fuse_ref }}
          persist-credentials: false

      - name: Install MSYS2 build tools and native 32-bit dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          cache: true
          install: >-
            autoconf-wrapper automake-wrapper libtool make git curl
            mingw-w64-i686-gcc mingw-w64-i686-pkgconf
            mingw-w64-i686-bzip2 mingw-w64-i686-zlib

      - name: Cache pinned cryptographic package downloads
        if: ${{ inputs.use_libgcrypt }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/fuse-mingw32-crypto
          key: msys2-mingw32-crypto-v1-${{ hashFiles('.github/scripts/windows-mingw32-crypto.sha256') }}

      - name: Install pinned MSYS2 cryptographic libraries
        if: ${{ inputs.use_libgcrypt }}
        run: |
          cache="$(cygpath -u "$RUNNER_TEMP")/fuse-mingw32-crypto"
          # Recheck hashes and signatures on cache hits as well as fresh downloads.
          bash .github/scripts/install_windows_crypto.sh "$cache"
          mkdir -p /usr/local/i686-w64-mingw32/share/fuse/packages
          cp "$cache/"*.pkg.tar.zst "$cache/"*.pkg.tar.zst.sig /usr/local/i686-w64-mingw32/share/fuse/packages/

      - name: Fetch pinned libspectrum source
        run: |
          git submodule update --init "$LIBSPECTRUM_DIR"
          git -C "$LIBSPECTRUM_DIR" rev-parse HEAD
          gcc --version

      - name: Configure libspectrum with integrated PCM WAV support
        working-directory: ${{ env.LIBSPECTRUM_DIR }}
        run: |
          set -o pipefail
          export PATH="/usr/local/i686-w64-mingw32/bin:$PATH"
          # /etc/profile resets this variable when each MSYS2 shell starts.
          export PKG_CONFIG_PATH="/usr/local/i686-w64-mingw32/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          ./autogen.sh
          # Keep the normal static archive available for internal unit tests.
          ./configure --prefix=/usr/local/i686-w64-mingw32 --with-fake-glib --with-wav-backend=pcm \
            ${{ inputs.use_zlib == false && '--without-zlib' || '' }} \
            ${{ inputs.use_bzip2 == false && '--without-bzip2' || '' }} \
            ${{ inputs.use_libgcrypt == false && '--without-libgcrypt' || '' }} \
            2>&1 | tee configure.out
          .github/scripts/in_config.sh "selected WAV backend: pcm"
          .github/scripts/in_config.sh "Internal GLib replacement: yes"
          .github/scripts/in_config.sh "libgcrypt support: ${{ inputs.use_libgcrypt && 'yes' || 'no' }}"

      - name: Build, test and install
        working-directory: ${{ env.LIBSPECTRUM_DIR }}
        run: |
          export PATH="/usr/local/i686-w64-mingw32/bin:$PATH"
          make -j2
          make check
          make install-strip

      - name: Stage exact runtime dependencies and notices
        run: |
          bash data/win32/check_win32_dll_deps.sh /usr/local/i686-w64-mingw32/bin
          bash .github/scripts/collect_windows_notices.sh /usr/local/i686-w64-mingw32/bin /usr/local/i686-w64-mingw32/share/fuse/3rd-party
          pacman -Q > /usr/local/i686-w64-mingw32/share/fuse/msys2-packages.txt
          cp "$LIBSPECTRUM_DIR/COPYING" /usr/local/i686-w64-mingw32/share/fuse/3rd-party/libspectrum-COPYING.txt
          # Include native DLLs used by this build, not independently selected ones.
          tar -cvf libspectrum-installed-windows.tar -C /usr/local/i686-w64-mingw32 .

      - name: Upload library, runtime DLLs and package manifest
        uses: actions/upload-artifact@v7
        with:
          name: libspectrum-installed-windows-${{ inputs.key }}
          path: libspectrum-installed-windows.tar
